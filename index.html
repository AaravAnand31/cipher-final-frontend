<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1c6b2a" />
  <title>Fliqr</title>

  <!-- PWA manifest — enables "Add to Home Screen" / install prompt -->
  <link rel="manifest" href="manifest.json" />

  <!-- Standard favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />

  <!-- iOS home-screen support — Safari ignores manifest.json for these, needs its own tags -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fliqr" />

  <!-- Android/Chrome install behavior -->
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="app"></div>
  <div id="toast-container"></div>
  <div id="sheet-container"></div>

  <!-- Socket.io client — must load before app.js -->
  <script src="https://cipher-425d.onrender.com/socket.io/socket.io.js"></script>

  <!-- App router — must be app.js NOT main.js -->
  <script type="module" src="js/app.js"></script>

  <!-- Register service worker for offline app-shell + installability -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>

</body>
</html>
